[project]
name = "ustack-logging"
version = "1.0.3"
description = "Default logging configuration for uStack style Python applications."
authors = [{name = "uStudio Developers", email = "dev@ustudio.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4"
dynamic = ["dependencies"]

[tool.poetry]
requires-poetry = ">=2.4.1"
packages = [{include = "ustack_logging"}]

[tool.poetry.dependencies]
datadog-logger = "^1.0.3"
datadog = ">=0.52.2"
kubernetes = ">=26.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
flake8 = "^7.4.1"
mypy = "^2.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
